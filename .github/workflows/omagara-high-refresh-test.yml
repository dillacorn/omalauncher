name: Omalauncher high-refresh isolated validation

on:
  push:
    branches: [test/owl-high-refresh]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
      - name: Run OWL and app unit tests
        run: ./gradlew :owl:test :app:testFossDebugUnitTest :owl:owlJar
      - name: Assemble app and run lint checks
        run: ./gradlew :app:assembleFossDebug :app:lintFossDebug :app:lintPlayDebug
